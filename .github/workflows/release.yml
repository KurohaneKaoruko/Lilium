# 发布工作流:推送 v* tag 触发
# 产物:
#   - lilium-server-x86_64-linux.tar.gz  (服务端二进制 + Web 静态资源,开箱即用)
#   - Docker 镜像 → ghcr.io/kurohanekaoruko/lilium
# 桌面端(Tauri)暂不自动构建:需要各平台 WebView 工具链,后续按需添加矩阵

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-server:
    name: 构建服务端 (x86_64 Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 编译缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          prefix-key: release-server

      - name: 安装前端工具链
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 构建前端
        working-directory: web
        run: |
          npm ci || npm install
          npm run build

      - name: 构建服务端 (release)
        run: cargo build --release -p lilium-server

      - name: 组装发布包
        run: |
          mkdir -p dist/lilium-web
          cp target/release/lilium-server dist/
          cp -r web/dist dist/lilium-web
          cat > dist/README.txt <<'EOF'
Lilium 服务端 (x86_64 Linux)

启动:
  ./lilium-server --library ~/Lilium --dist lilium-web --port 7333 --open

选项:
  -p, --port <端口>     监听端口 (默认 7333,占用自动递增)
  -l, --library <路径>  库路径 (.lilium 库或 Eagle .library 目录,缺省 ~/Lilium)
      --dist <目录>     Web 前端静态目录 (本包内 lilium-web)
      --open            启动后打开浏览器

Docker 部署见仓库 docker-compose.yml;
桌面端 (Tauri) 构建见仓库 README。
EOF
          sha256sum lilium-server-x86_64-linux.tar.gz > SHA256SUMS.txt

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: server-dist
          path: |
            lilium-server-*.tar.gz
            SHA256SUMS.txt
          retention-days: 3

  release:
    name: 发布 Release
    needs: build-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: server-dist

      - name: 创建 Release 并上传
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            lilium-server-*.tar.gz
            SHA256SUMS.txt

  docker:
    name: Docker 镜像 → GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
