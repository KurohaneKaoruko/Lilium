# 发布工作流:推送 v* tag 触发,构建 Tauri 桌面安装包
#
# 产物 (GitHub Release 附件):
#   Linux:  .deb / .AppImage / .rpm
#   Windows: .msi / .exe (NSIS)
#   macOS:  .dmg / .app (aarch64 + x86_64 universal)
#
# 前端由 tauri-action 内部的 beforeBuildCommand 构建。

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos

    runs-on: ${{ matrix.os }}
    name: 桌面安装包 (${{ matrix.label }})

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          prefix-key: tauri-${{ matrix.label }}

      # Linux 需要 WebView2/WebKitGTK 与 AppImage 打包工具
      - name: 安装 Linux 依赖
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2

      - name: 安装前端依赖
        working-directory: web
        run: npm ci || npm install

      - name: 构建前端
        working-directory: web
        run: npm run build

      - name: 构建 Tauri 安装包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Lilium ${{ github.ref_name }}"
          releaseBody: "下载对应平台的安装包。更新内容见下方自动生成的提交列表。"
          releaseDraft: false
          prerelease: false
          includeRelease: ${{ startsWith(github.ref, 'refs/tags/v') }}
          includeUpdater: false

  docker:
    name: Docker 镜像 → GHCR
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
